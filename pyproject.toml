[project]
name = "cash-ash"
version = "0.1.0"
description = "AI-assisted research and decision support for a small personal stock portfolio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.100.0",
    "python-dotenv==1.0.1",
    "rich==14.3.3",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.15.6",
]
# Only needed to build the public site (`marketing/build.py`); the CLI never
# imports it. markdown-it-py also arrives transitively via rich, but the site
# build pins it directly rather than relying on another package's dep.
site = [
    "markdown-it-py==4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
