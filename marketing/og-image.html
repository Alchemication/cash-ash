<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CashAsh link preview source</title>
<!--
  Source for site/assets/og-image.png, the 1200x630 link-preview image. It is
  not part of the built site; render it with headless Chrome from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --screenshot=marketing/site/assets/og-image.png marketing/og-image.html

  The palette comes from base.css so the preview cannot drift from the site.
  base.css declares its fonts relative to the site root, which does not resolve
  from here, so the two faces are declared again below under their own names.
-->
<link rel="stylesheet" href="site/assets/base.css">
<style>
@font-face {
  font-family: "OG Display";
  font-weight: 200 800;
  font-stretch: 75% 100%;
  src: url("site/assets/fonts/bricolage-grotesque.woff2") format("woff2");
}
@font-face {
  font-family: "OG Text";
  font-weight: 200 800;
  src: url("site/assets/fonts/newsreader.woff2") format("woff2");
}
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  background:
    linear-gradient(to right, transparent 118px, var(--ember) 118px, var(--ember) 121px, transparent 121px),
    repeating-linear-gradient(to bottom, transparent 0 51px, var(--rule) 51px 52px),
    var(--ash-black);
  font-family: "OG Text", Georgia, serif;
}
.mark {
  position: absolute; top: 44px; left: 150px;
  display: flex; align-items: center;
  font-family: "OG Display", sans-serif; font-size: 30px; font-weight: 700; font-stretch: 85%;
}
.mark .logo { width: 40px; height: 40px; margin-right: 14px; mix-blend-mode: lighten; mask-image: none; -webkit-mask-image: none; position: static; }
.mark i { font-style: normal; color: var(--ash); }
h1 {
  position: absolute; left: 150px; top: 200px; margin: 0; z-index: 1;
  font-family: "OG Display", sans-serif; font-size: 118px; font-weight: 800; font-stretch: 78%;
  line-height: .92; letter-spacing: -.025em; color: var(--bone);
}
p {
  position: absolute; left: 150px; top: 335px; margin: 0; width: 560px; z-index: 1;
  font-family: "OG Display", sans-serif; font-size: 34px; font-weight: 500; font-stretch: 92%;
  line-height: 1.2; color: var(--bone);
}
img {
  position: absolute; right: 0; top: 15px; width: 600px; height: 600px;
  mix-blend-mode: lighten;
  mask-image: radial-gradient(ellipse 62% 62% at 50% 52%, #000 60%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 62% 62% at 50% 52%, #000 60%, transparent 100%);
}
</style>
</head>
<body>
<div class="mark">
  <img class="logo" src="site/assets/mark.png" alt="">
  Cash<i>Ash</i>
</div>
<h1>Cash to ash?</h1>
<p>Slow down, research, decide, learn.</p>
<img src="site/assets/cash-ash-hero.jpg" alt="">
</body>
</html>
